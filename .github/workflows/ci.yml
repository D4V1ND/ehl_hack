name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/erp/package-lock.json
            apps/web/package-lock.json

      - name: Install Python packages
        run: |
          python -m pip install -e .
          python -m pip install -e 'apps/api[dev]'

      - name: API tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          FAKE_CALLS: "1"
          LIVE_CALLS: ""
        run: python -m pytest -q -m "not live"

      - name: Install ERP
        working-directory: apps/erp
        run: npm ci

      - name: Verify ERP
        working-directory: apps/erp
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: Install SupplyOS
        working-directory: apps/web
        run: npm ci

      - name: Verify SupplyOS
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run build

      - name: Generated contracts are current
        run: |
          python run.py contracts
          git diff --exit-code
