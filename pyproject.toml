[project]
name = "supplyos-contracts"
version = "0.1.0"
description = "Shared data contracts for SupplyOS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.setuptools.package-data]
"packages.contracts" = ["*.json", "generated/*.ts"]
