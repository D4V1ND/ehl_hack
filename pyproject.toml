[project]
name = "supplyguard"
version = "0.1.0"
description = "Autonomous sourcing agent — core API, system of record and seed data (Slice B)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "packages*"]

[tool.setuptools.package-data]
"backend.record" = ["demo_data/*.yaml"]
